<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles/main_style.css') }}" />
    <title>Login / Register</title>
</head>

<body>
    <div id="login-section">
        <h2>Login</h2>
        <form id="loginForm">
            <div>
                <label for="login-nickname">Nickname:</label>
                <input type="text" id="login-nickname" name="nickname" required>
            </div>
            <div>
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div id="login-message"></div>
    </div>

    <hr>

    <div id="register-section">
        <h2>Register</h2>
        <form id="registerForm">
            <div>
                <label for="reg-nickname">Nickname:</label>
                <input type="text" id="reg-nickname" name="nickname" required>
            </div>
            <div>
                <label for="reg-password">Password:</label>
                <input type="password" id="reg-password" name="password" required>
            </div>
            <button type="submit">Register</button>
        </form>
        <div id="register-message"></div>
    </div>

    <script src="{{ url_for('static', path='/scripts/authorization.js') }}"></script>
</body>

</html>
